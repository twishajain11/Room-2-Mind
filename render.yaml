# Render blueprint. Spec section 3.2 pins deployment to Render, Node runtime.
#
# The Postgres instance was deliberately held back until Week 3, because
# Render's free database expires 30 days after it is created and nothing read
# it until the collection instrument existed. It exists now, so the database
# joins the blueprint here.

services:
  - type: web
    name: room-to-mind
    runtime: node
    plan: free
    # Region defaults to Oregon. Singapore is far closer to India if the free
    # tier allows it, which matters for demo latency but not for correctness:
    # every model and every feature runs in the browser regardless.
    #
    # Migrations deliberately do NOT run in the build. See scripts/start.mjs:
    # the site must still serve when the database is not wired up yet, because
    # everything except storing a calibration response works without it.
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      # Cap the heap below the free tier's 512MB so Node garbage-collects under
      # pressure instead of being killed outright. A heap cap produces a real
      # error message; an OOM kill produces silence.
      - key: NODE_OPTIONS
        value: --max-old-space-size=420
      - key: DATABASE_URL
        fromDatabase:
          name: room-to-mind-db
          property: connectionString

databases:
  - name: room-to-mind-db
    plan: free
